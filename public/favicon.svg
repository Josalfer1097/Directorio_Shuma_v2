<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="iriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9A7"/>
      <stop offset="45%" style="stop-color:#845EC2"/>
      <stop offset="100%" style="stop-color:#00C2FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141618"/>
      <stop offset="100%" style="stop-color:#0C0E11"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bgGrad)"/>
  
  <!-- Border glow -->
  <rect width="64" height="64" rx="13" fill="none" 
        stroke="url(#iriGrad)" stroke-width="1.2" opacity="0.35"/>

  <!-- Geometric S path - clean and bold -->
  <!-- Top horizontal bar -->
  <rect x="17" y="11" width="28" height="7" rx="3.5" fill="url(#iriGrad)"/>
  <!-- Middle horizontal bar -->
  <rect x="17" y="28.5" width="28" height="7" rx="3.5" fill="url(#iriGrad)"/>
  <!-- Bottom horizontal bar -->
  <rect x="17" y="46" width="28" height="7" rx="3.5" fill="url(#iriGrad)"/>
  <!-- Top-left vertical connector -->
  <rect x="17" y="11" width="7" height="18" rx="0" fill="url(#iriGrad)"/>
  <!-- Bottom-right vertical connector -->
  <rect x="40" y="35.5" width="5" height="17.5" rx="0" fill="url(#iriGrad)"/>
  
  <!-- Corner roundings for top-left -->
  <rect x="17" y="11" width="7" height="7" rx="3.5" fill="url(#iriGrad)"/>
  <!-- Corner roundings for top-right -->
  <rect x="40" y="11" width="5" height="7" rx="2.5" fill="url(#iriGrad)"/>
  <!-- Corner roundings for bottom-left -->
  <rect x="17" y="46" width="7" height="7" rx="2.5" fill="url(#iriGrad)"/>
  <!-- Corner roundings for bottom-right -->
  <rect x="40" y="46" width="5" height="7" rx="3.5" fill="url(#iriGrad)"/>
</svg>